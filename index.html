<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPD &amp; Nurse Note Audit — รพ.มหาราชนครเชียงใหม่</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"IBM Plex Sans Thai"', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#f0fdfa',
                100: '#ccfbf1',
                200: '#99f6e4',
                500: '#14b8a6',
                600: '#0d9488',
                700: '#0f766e',
                800: '#115e59',
                900: '#134e4a',
              },
            },
          },
        },
      };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <style>
      html {
        font-size: 16px;
        -webkit-text-size-adjust: 100%;
      }
      body {
        font-family: 'IBM Plex Sans Thai', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        line-height: 1.6;
      }
      /* Prevent iOS Safari auto-zoom on form controls & ensure >=44px touch targets */
      input,
      select,
      textarea {
        font-size: 16px !important;
      }
      .kw {
        background: #e6faf6;
        color: #0f5f58;
        font-weight: 600;
        padding: 0.05rem 0.35rem;
        border-radius: 0.375rem;
        white-space: nowrap;
      }
      .seg-btn {
        transition: all 0.14s ease;
        min-height: 42px;
      }
      .seg-btn:active {
        transform: scale(0.97);
      }
      .step-pill-active {
        background: #0f766e;
        color: #ffffff;
        box-shadow: 0 1px 4px rgba(15, 118, 110, 0.28);
      }
      /* Clean scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 999px;
      }
      #pdf-print-area {
        display: none;
      }
      @media print {
        @page {
          size: A4 portrait;
          margin: 12mm;
        }
        body {
          background: #ffffff !important;
          color: #0f172a !important;
        }
        .no-print,
        header,
        main,
        #modal-root,
        #toast-root {
          display: none !important;
        }
        #pdf-print-area {
          display: block !important;
        }
        .print-avoid-break {
          break-inside: avoid;
          page-break-inside: avoid;
        }
      }
    </style>
  </head>
  <body class="min-h-screen flex flex-col antialiased">
    <!-- Minimal Top Header -->
    <header class="bg-white/90 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-30 no-print">
      <div class="max-w-6xl mx-auto px-4 sm:px-6">
        <div class="flex items-center justify-between h-16 gap-4">
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-10 h-10 rounded-xl bg-brand-700 text-white flex items-center justify-center shrink-0">
              <i data-lucide="clipboard-check" class="w-5 h-5"></i>
            </div>
            <div class="truncate">
              <h1 class="text-base sm:text-lg font-bold text-slate-900 tracking-tight truncate">
                OPD &amp; Nurse Note Audit
              </h1>
              <p class="text-xs text-slate-500 truncate">
                โรงพยาบาลมหาราชนครเชียงใหม่
              </p>
            </div>
          </div>

          <div class="flex items-center gap-2">
            <nav class="flex items-center bg-slate-100/90 p-1 rounded-xl" id="main-nav">
              <button
                data-view="audit"
                class="nav-btn px-3.5 py-2 rounded-lg text-sm sm:text-base font-semibold flex items-center gap-1.5 transition whitespace-nowrap"
              >
                <i data-lucide="file-plus-2" class="w-4 h-4"></i>
                <span>ประเมิน</span>
              </button>
              <button
                data-view="dashboard"
                class="nav-btn px-3.5 py-2 rounded-lg text-sm sm:text-base font-semibold flex items-center gap-1.5 transition whitespace-nowrap"
              >
                <i data-lucide="pie-chart" class="w-4 h-4"></i>
                <span>แดชบอร์ด</span>
              </button>
              <button
                data-view="history"
                class="nav-btn px-3.5 py-2 rounded-lg text-sm sm:text-base font-semibold flex items-center gap-1.5 transition whitespace-nowrap"
              >
                <i data-lucide="folder-open" class="w-4 h-4"></i>
                <span>ประวัติ</span>
              </button>
            </nav>

            <a
              id="sheet-status-pill"
              href="#"
              target="_blank"
              rel="noopener"
              class="hidden sm:inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border border-emerald-200 bg-emerald-50/70 text-emerald-700 text-xs font-medium hover:bg-emerald-100/80 transition whitespace-nowrap"
              title="เปิด Google Sheet ที่เชื่อมต่ออยู่"
            >
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
              <span>Google Sheet</span>
            </a>
          </div>
        </div>
      </div>
    </header>

    <!-- Main App Container -->
    <main id="app-root" class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 no-print"></main>

    <!-- Dedicated A4 PDF Print Container -->
    <section id="pdf-print-area"></section>

    <!-- Modal Root -->
    <div id="modal-root" class="hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto no-print"></div>

    <!-- Toast Root -->
    <div id="toast-root" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none no-print"></div>

    <script type="module" src="./app.js?v=8"></script>
  </body>
</html>
